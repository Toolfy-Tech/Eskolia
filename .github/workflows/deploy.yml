name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        run: |
          ARCHIVE=$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | python3 -c "import sys,json; d=json.load(sys.stdin); r=next(r for r in d['releases'] if r['channel']=='stable'); print(d['base_url']+'/'+r['archive'])")
          curl -fsSL "$ARCHIVE" -o flutter.tar.xz
          tar xf flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version + disable analytics
        run: |
          flutter --version
          flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy hosting + Firestore rules & indexes
        run: firebase deploy --only hosting,firestore --project eskolia
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
